[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camunda-office-library"
version = "1.0.0"
description = "Robot Framework library for Office automation with pywinauto"
requires-python = ">=3.12"
dependencies = [
    "pywinauto>=0.6.8"
]

[tool.setuptools]
package-dir = {"" = "src"}

py-modules = [
    "OutlookLibrary",
    "OfficeCommon",
    "OfficeInspectorLibrary",
    "ExcelLibrary",
    "WordLibrary",
    "PowerPointLibrary"
]