
name: Deploy office-library

on:
  push:
    branches: [main]
    paths:
      - "rpa-libraries/office-library/**"
      - ".github/workflows/deploy-office-library.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-library-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rpa-libraries/office-library

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          mkdir -p dist
          rm -f dist/*.whl
          python -m pip wheel . --no-deps -w dist

      - name: Verify exactly one wheel
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test ${#wheels[@]} -eq 1
          sha256sum "${wheels[0]}"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: office-library-wheel
          path: rpa-libraries/office-library/dist/*.whl
          if-no-files-found: error

  deploy-vm:
    needs: build
    runs-on: [self-hosted, Windows, X64, rpa-vm]

    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: office-library-wheel
          path: wheel

      - name: Verify downloaded wheel
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $wheels = @(Get-ChildItem wheel -Filter *.whl)
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one wheel"
          }

          Get-FileHash $wheels[0].FullName -Algorithm SHA256

          Write-Host "Wheel successfully downloaded to RPA-WINDOWS-01"
      - name: Check RPA deployment permissions
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          Write-Host "Runner identity:"
          whoami

          Write-Host "Python installation:"
          $python = "C:\dev\camunda-rpa-worker\python\venv\Scripts\python.exe"

          if (-not (Test-Path $python)) {
            throw "RPA Python environment not found"
          }

          & $python --version

          Write-Host "RPA Worker scheduled task:"
          Get-ScheduledTask -TaskName "Camunda-RPA-Worker" |
            Select-Object TaskName, State, TaskPath

          Write-Host "RPA Worker process:"
          Get-CimInstance Win32_Process |
            Where-Object {
              $_.Name -eq "rpa-worker_1.3.2_win32_amd64.exe"
            } |
            Select-Object ProcessId, Name