name: Playwright Runner Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - playwright

    steps:
      - name: Show runner information
        shell: powershell
        run: |
          Write-Host "Runner is working"
          hostname
          whoami

      - name: Check Node.js
        shell: powershell
        run: |
          node --version
          npm --version

      - name: Check Git
        shell: powershell
        run: |
          git --version