
name: Build Office Library Wheel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rpa-libraries/office-library

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and checksum
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel

          mkdir -p dist
          rm -f dist/*.whl dist/*.sha256

          python -m pip wheel . --no-deps -w dist

          cd dist

          wheels=(*.whl)

          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one wheel"
            exit 1
          fi

          sha256sum "${wheels[0]}" > wheel.sha256
          sha256sum --check wheel.sha256

          ls -lah

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: office-library-wheel
          path: rpa-libraries/office-library/dist/
          if-no-files-found: error
          retention-days: 30
