server:
  port: 8082

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://192.168.56.101:5432/orderdb?sslmode=require
    username: order_app
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

camunda:
  client:
    mode: self-managed
    auth:
      method: none
    rest-address: http://localhost:8080
    grpc-address: http://localhost:26500